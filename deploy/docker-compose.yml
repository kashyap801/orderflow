services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-orderflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-change-me}
    ports:
      - '${MONGODB_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - orderflow
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          -u "$${MONGO_INITDB_ROOT_USERNAME}"
          -p "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping')" || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-orderflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-change-me}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mongosh "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/admin?authSource=admin&directConnection=true" --quiet --eval "
          try { rs.status() } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] })
          }
        "
    networks:
      - orderflow

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    networks:
      - orderflow
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - orderflow
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 10s
      retries: 20

  order-service:
    build:
      context: ..
      dockerfile: apps/order-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MONGODB_URI_ORDER: mongodb://${MONGODB_USER:-orderflow}:${MONGODB_PASSWORD:-change-me}@mongo:27017/orderflow_order?replicaSet=rs0&authSource=admin
      MONGODB_AUTO_INDEX: 'true'
      REDIS_ENABLED: 'true'
      REDIS_URL: redis://redis:6379
      KAFKA_ENABLED: 'true'
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: orderflow-order-dev
    ports:
      - '${PORT_ORDER_SERVICE:-3001}:3001'
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - orderflow
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:3001/api/v1/health >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
  redis-data:
  kafka-data:

networks:
  orderflow:
    driver: bridge
