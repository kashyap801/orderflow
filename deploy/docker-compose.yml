services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    # Local development MongoDB intentionally runs without auth. Atlas uses credentials in MONGODB_URI_*.
    ports:
      - '${MONGODB_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - orderflow
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "db.adminCommand('ping')" || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mongosh "mongodb://mongo:27017/admin?directConnection=true" --quiet --eval "
          try { rs.status() } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] })
          }
        "
    networks:
      - orderflow

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    networks:
      - orderflow
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - orderflow
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 10s
      retries: 20

  order-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: order-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT_ORDER_SERVICE: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-orderflow-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      MONGODB_URI_ORDER: '${MONGODB_URI_ORDER:-mongodb://mongo:27017/orderflow_order?replicaSet=rs0}'
      MONGODB_AUTO_INDEX: 'true'
      INVENTORY_SERVICE_URL: http://inventory-service:3002
      REDIS_ENABLED: 'false'
      KAFKA_ENABLED: 'true'
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: orderflow-order-dev
    ports:
      - '${PORT_ORDER_SERVICE:-3001}:3001'
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - orderflow
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3001/api/v1/health >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  inventory-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: inventory-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT_INVENTORY_SERVICE: 3002
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MONGODB_URI_INVENTORY: '${MONGODB_URI_INVENTORY:-mongodb://mongo:27017/orderflow_inventory?replicaSet=rs0}'
      MONGODB_AUTO_INDEX: 'true'
      REDIS_ENABLED: 'true'
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: '300'
      KAFKA_ENABLED: 'false'
    ports:
      - '${PORT_INVENTORY_SERVICE:-3002}:3002'
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - orderflow
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3002/api/v1/health >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  payment-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: payment-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT_PAYMENT_SERVICE: 3003
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MONGODB_URI_PAYMENT: '${MONGODB_URI_PAYMENT:-mongodb://mongo:27017/orderflow_payment?replicaSet=rs0}'
      MONGODB_AUTO_INDEX: 'true'
      REDIS_ENABLED: 'false'
      KAFKA_ENABLED: 'false'
    ports:
      - '${PORT_PAYMENT_SERVICE:-3003}:3003'
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      - orderflow
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3003/api/v1/health >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  notification-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT_NOTIFICATION_SERVICE: 3004
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MONGODB_URI_NOTIFICATION: '${MONGODB_URI_NOTIFICATION:-mongodb://mongo:27017/orderflow_notification?replicaSet=rs0}'
      MONGODB_AUTO_INDEX: 'true'
      REDIS_ENABLED: 'false'
      KAFKA_ENABLED: 'true'
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: orderflow-notification-dev
      KAFKA_CONSUMER_GROUP_ID: orderflow-notification-dev
    ports:
      - '${PORT_NOTIFICATION_SERVICE:-3004}:3004'
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - orderflow
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3004/api/v1/health >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT_API_GATEWAY: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-orderflow-dev-secret-change-me}
      ORDER_SERVICE_URL: http://order-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      REDIS_ENABLED: 'false'
      KAFKA_ENABLED: 'false'
    ports:
      - '${PORT_API_GATEWAY:-3000}:3000'
    depends_on:
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - orderflow
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
  redis-data:
  kafka-data:

networks:
  orderflow:
    driver: bridge
